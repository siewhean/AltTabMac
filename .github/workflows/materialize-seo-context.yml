name: Materialize SEO Project Context

on:
  push:
    branches:
      - agent/seo-geo-competitive-hardening
    paths:
      - scripts/patch_seo_context.py
      - .github/workflows/materialize-seo-context.yml

permissions:
  contents: write

concurrency:
  group: materialize-seo-project-context
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out specialist branch
        uses: actions/checkout@v4
        with:
          ref: agent/seo-geo-competitive-hardening
          fetch-depth: 0

      - name: Apply asserted README update
        run: python3 scripts/patch_seo_context.py

      - name: Verify canonical context
        shell: bash
        run: |
          grep -F "Last Updated: 2026-07-20" README.md
          grep -F "Competitive SEO/GEO hardening" README.md
          grep -F "Next.js 16.2.10" README.md
          grep -F "Google Search Console" README.md
          grep -F "2026-07-20: Added an independent competitor-informed SEO and GEO hardening pass" README.md
          git diff --check

      - name: Commit canonical context
        shell: bash
        run: |
          rm scripts/patch_seo_context.py
          rm .github/workflows/materialize-seo-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/patch_seo_context.py .github/workflows/materialize-seo-context.yml
          git commit -m "Update canonical SEO and GEO project context"
          git push origin HEAD:agent/seo-geo-competitive-hardening
