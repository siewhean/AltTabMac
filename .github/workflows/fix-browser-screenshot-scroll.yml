name: Fix Browser Screenshot Scroll

on:
  push:
    branches:
      - agent/implement-seo-geo-audit
    paths:
      - .github/workflows/fix-browser-screenshot-scroll.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/implement-seo-geo-audit
          fetch-depth: 0

      - name: Make screenshot scroll position immediate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("website/scripts/verify-browser.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''        expression: `new Promise(async (resolve) => {
                    if (document.fonts?.ready) await document.fonts.ready;
                    const max = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);'''
          new = '''        expression: `new Promise(async (resolve) => {
                    if (document.fonts?.ready) await document.fonts.ready;
                    document.documentElement.style.scrollBehavior = 'auto';
                    document.body.style.scrollBehavior = 'auto';
                    const max = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);'''
          if old not in text:
              raise SystemExit("Expected browser scroll block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/fix-browser-screenshot-scroll.yml

      - name: Commit screenshot fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/scripts/verify-browser.mjs .github/workflows/fix-browser-screenshot-scroll.yml
          git commit -m "Capture browser verification screenshots from page top"
          git push origin HEAD:agent/implement-seo-geo-audit
