name: Database backup

# Nightly logical backup of the production Neon database (neondb) to S3.
# Neon's own point-in-time history covers only 6 hours on the current plan;
# these dumps cover the last 35 days. See docs/operations/database-backups.md.
on:
  schedule:
    - cron: "17 19 * * *" # 03:17 Singapore time
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role; no stored AWS keys

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ap-southeast-1
      BUCKET: cmdtab-db-backups-880302055919
      PREFIX: neondb
      PG_IMAGE: postgres:17
    steps:
      - name: Assume the upload-only backup role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::880302055919:role/cmdtab-github-db-backup
          aws-region: ap-southeast-1

      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::NEON_BACKUP_DATABASE_URL is not set"
            exit 1
          fi
          docker run --rm -e DATABASE_URL -v "$PWD:/out" "$PG_IMAGE" \
            sh -c 'pg_dump --format=custom --compress=9 --dbname="$DATABASE_URL" --file=/out/neondb.dump'

      - name: Verify the dump can be read back
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/out" "$PG_IMAGE" pg_restore --list /out/neondb.dump > toc.txt
          tables=$(grep -c ' TABLE DATA ' toc.txt || true)
          if ! grep -q ' TABLE DATA public waitlist_signups ' toc.txt; then
            echo "::error::Dump has no waitlist_signups data"
            exit 1
          fi
          if [ "$tables" -lt 50 ]; then
            echo "::error::Dump has only $tables tables of data"
            exit 1
          fi
          echo "TABLES=$tables" >> "$GITHUB_ENV"

      - name: Upload to S3
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%M%SZ)
          key="${PREFIX}/$(date -u +%Y/%m/%d)/neondb-${stamp}.dump"
          sha256sum neondb.dump | awk '{print $1}' > neondb.dump.sha256
          aws s3 cp neondb.dump "s3://${BUCKET}/${key}" --only-show-errors
          aws s3 cp neondb.dump.sha256 "s3://${BUCKET}/${key}.sha256" --only-show-errors
          {
            echo "### Database backup"
            echo "- Object: \`s3://${BUCKET}/${key}\`"
            echo "- Size: $(du -h neondb.dump | cut -f1)"
            echo "- Tables with data: ${TABLES}"
            echo "- SHA-256: \`$(cat neondb.dump.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
