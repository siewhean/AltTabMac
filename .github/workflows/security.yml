name: Security

on:
  # Security must execute for every candidate change. Path filters would let a
  # native, release, or workflow-only correction bypass this required check.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  website-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify immutable workflow action pins
        working-directory: ${{ github.workspace }}
        run: python3 scripts/release/verify-workflow-actions.py

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run security:deps

      - name: Typecheck and production build
        run: npm run security:check
