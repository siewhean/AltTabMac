name: Security

on:
  push:
    paths:
      - "website/**"
      - ".github/workflows/security.yml"
      - "scripts/release/verify-workflow-actions.py"
      - "SECURITY.md"
      - "SECURITY_CHECKLIST.md"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/security.yml"
      - "scripts/release/verify-workflow-actions.py"
      - "SECURITY.md"
      - "SECURITY_CHECKLIST.md"

jobs:
  website-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify immutable workflow action pins
        working-directory: ${{ github.workspace }}
        run: python3 scripts/release/verify-workflow-actions.py

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run security:deps

      # Build tooling (Tailwind 3's watcher/glob chain) has advisories with no
      # patched release. Report them on every run without blocking deploys;
      # migrating to Tailwind 4 clears them.
      - name: Full dependency audit (including dev tooling, informational)
        continue-on-error: true
        run: npm run security:deps:all

      - name: Typecheck and production build
        run: npm run security:check
