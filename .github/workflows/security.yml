name: Security

on:
  push:
    paths:
      - "website/**"
      - ".github/workflows/security.yml"
      - "scripts/release/verify-workflow-actions.py"
      - "SECURITY.md"
      - "SECURITY_CHECKLIST.md"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/security.yml"
      - "scripts/release/verify-workflow-actions.py"
      - "SECURITY.md"
      - "SECURITY_CHECKLIST.md"

jobs:
  website-security:
    runs-on: ubuntu-latest
    env:
      FFMPEG_BIN: /usr/bin/ffmpeg
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify immutable workflow action pins
        working-directory: ${{ github.workspace }}
        run: python3 scripts/release/verify-workflow-actions.py

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install ffmpeg from the Ubuntu archive
        # ffmpeg-static's postinstall otherwise downloads its binary from
        # GitHub releases, which can fail with 5xx for long stretches.
        # FFMPEG_BIN (job env) points ffmpeg-static at this binary instead.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run security:deps

      # Build tooling (Tailwind 3's watcher/glob chain) has advisories with no
      # patched release. Report them on every run without blocking deploys;
      # migrating to Tailwind 4 clears them.
      - name: Full dependency audit (including dev tooling, informational)
        continue-on-error: true
        run: npm run security:deps:all

      - name: Typecheck and production build
        run: npm run security:check
