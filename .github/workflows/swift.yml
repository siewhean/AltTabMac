name: Swift

# Protect the public completeness and exact-window MRU contract on every app change.
# Phase 0 revalidates the exact release-readiness head on both supported hosted macOS runners.
on:
  push:
    paths:
      - Package.swift
      - Package.resolved
      - Resources/Info.plist
      - Resources/PrivacyInfo.xcprivacy
      - release/**
      - Sources/CmdTab/**
      - Tests/CmdTabTests/**
      - scripts/release/**
      - scripts/performance/**
      - Tests/Fixtures/PerformanceProbe/**
      - website/src/lib/aws-kms-p256.ts
      - website/scripts/verify-beta-trial-readiness.mjs
      - website/tests/beta-trial-readiness.test.mjs
      - docs/qa/private-capability-canary.*
      - scripts/qa/**
      - .github/workflows/swift.yml
  pull_request:
    branches:
      - main
    paths:
      - Package.swift
      - Package.resolved
      - Resources/Info.plist
      - Resources/PrivacyInfo.xcprivacy
      - release/**
      - Sources/CmdTab/**
      - Tests/CmdTabTests/**
      - scripts/release/**
      - scripts/performance/**
      - Tests/Fixtures/PerformanceProbe/**
      - website/src/lib/aws-kms-p256.ts
      - website/scripts/verify-beta-trial-readiness.mjs
      - website/tests/beta-trial-readiness.test.mjs
      - docs/qa/private-capability-canary.*
      - scripts/qa/**
      - .github/workflows/swift.yml

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Restore SwiftPM binary artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: swiftpm-artifacts-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Prime Sparkle binary artifact
        # github.com release downloads can fail with 5xx for long stretches
        # (SwiftPM then reports "already exists in file system" on the 92-byte
        # error page). Fetch the checksum-verified zip into SwiftPM's cache,
        # also through the GitHub API route, before resolving.
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/prime-sparkle-artifact.sh

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if swift package resolve; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1

      - name: Verify pre-fix model evidence remains reproducible
        shell: bash
        run: |
          python3 scripts/qa/switcher_mru_visibility_model_check.py > /tmp/switcher-model.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/switcher-model.json').read_text())
          mru = result['mru_selection']
          preview = result['preview_completeness']

          assert mru['meaningful_sequences_checked'] == 19_500, mru
          assert mru['strict_mru_selection_mismatches'] == 3_900, mru
          assert preview['preview_success_configurations_checked'] == 126, preview
          assert preview['completeness_failures'] == 120, preview
          print('Model evidence verified.')
          PY

      - name: Run strict MRU and completeness regressions
        run: >-
          swift test
          --scratch-path /tmp/CmdTab-focused-${{ matrix.runner }}
          --filter StrictMRUAndCompletenessRegressionTests

      - name: Run complete Swift package test suite
        run: swift test --scratch-path /tmp/CmdTab-test-${{ matrix.runner }}

      - name: Check patch hygiene
        run: git diff --check

  release-configuration:
    name: Deterministic release configuration
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release configuration without credentials
        run: |
          python3 scripts/release/release_config.py verify-repository
          python3 scripts/release/verify-public-release-controls.py
          python3 scripts/release/verify-privacy-manifest.py Resources/PrivacyInfo.xcprivacy
          python3 scripts/release/test-release-update-pipeline.py
          python3 scripts/release/test-private-capability-canary.py
          python3 scripts/performance/test-performance-evidence.py
          node --test website/tests/beta-trial-readiness.test.mjs
          bash -n scripts/release/*.sh
          bash -n scripts/performance/*.sh

      - name: Record non-hosted release boundary
        run: |
          echo "This job validates source and release configuration only."
          echo "It does not validate Accessibility, Screen Recording, Secure Input,"
          echo "private-capability canaries or physical macOS 14/15 acceptance,"
          echo "event-tap/HID delivery, physical desktops, signed update installation,"
          echo "notarization, Gatekeeper, performance, or soak acceptance."

      - name: Check patch hygiene
        run: git diff --check
