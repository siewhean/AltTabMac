name: Release Readiness

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-health:
    name: Repository and runner health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm hosted runner assignment
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "sha=${GITHUB_SHA}"
          echo "head_ref=${GITHUB_HEAD_REF}"
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify repository hygiene
        run: |
          set -euo pipefail
          test -z "$(git ls-files .build)"
          test -z "$(git ls-files | grep -E '(^|/)\.DS_Store$' || true)"
          test -s docs/release/native-production-readiness-plan.md
          python3 scripts/release/verify-workflow-actions.py
          git diff --check

  website-release-gate:
    name: Website Security, SEO, GEO, and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Disposable database for the analytics ingestion and rate-limit
    # contracts exercised by the browser checks. Only the production server
    # step receives DATABASE_URL; the build and source gates run without it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmdtab
          POSTGRES_PASSWORD: cmdtab-ci
          POSTGRES_DB: cmdtab_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmdtab -d cmdtab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOOGLE_SITE_VERIFICATION: cmdtab-google-verification-ci
      BING_SITE_VERIFICATION: cmdtab-bing-verification-ci
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run security:deps
      - name: Verify source SEO, media, and copy contracts
        run: npm run seo:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build production website
        run: npx next build --webpack
      - name: Start production server
        env:
          DATABASE_URL: postgres://cmdtab:cmdtab-ci@127.0.0.1:5432/cmdtab_ci
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/cmdtab-next.log 2>&1 &
          echo $! > /tmp/cmdtab-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cmdtab-next.log
          exit 1
      - name: Verify rendered website contracts
        run: |
          set -euo pipefail
          mkdir -p verification-artifacts
          npm run rendered:check 2>&1 | tee verification-artifacts/rendered-check.log
          npm run webmaster:check 2>&1 | tee verification-artifacts/webmaster-check.log
          npm run evidence:check 2>&1 | tee verification-artifacts/evidence-check.log
          npm run retrieval:check 2>&1 | tee verification-artifacts/retrieval-check.log
          npm run showcase:responses 2>&1 | tee verification-artifacts/showcase-responses.log
          npm run browser:check 2>&1 | tee verification-artifacts/browser-check.log
      - name: Collect website evidence
        if: always()
        run: |
          mkdir -p verification-artifacts
          cp /tmp/cmdtab-next.log verification-artifacts/next-server.log 2>/dev/null || true
          cp public/showcase/manifest.json verification-artifacts/showcase-manifest.json 2>/dev/null || true
          if [ -f /tmp/cmdtab-next.pid ]; then
            kill "$(cat /tmp/cmdtab-next.pid)" 2>/dev/null || true
          fi
      - name: Upload website evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-0-website-verification
          path: website/verification-artifacts
          if-no-files-found: warn
          retention-days: 14

  swift-release-gate:
    name: Swift ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-14
          - macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Confirm hosted macOS runner assignment
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "sha=${GITHUB_SHA}"
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Swift Testing-compatible Xcode on macOS 14
        # The macOS 14 runner's default Xcode has no Swift Testing module.
        if: matrix.runner == 'macos-14'
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Verify pre-fix model evidence
        run: |
          python3 scripts/qa/switcher_mru_visibility_model_check.py > /tmp/switcher-model.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/switcher-model.json').read_text())
          assert result['mru_selection']['meaningful_sequences_checked'] == 19_500
          assert result['mru_selection']['strict_mru_selection_mismatches'] == 3_900
          assert result['preview_completeness']['preview_success_configurations_checked'] == 126
          assert result['preview_completeness']['completeness_failures'] == 120
          PY
      - name: Run strict MRU and completeness regressions
        run: swift test --scratch-path /tmp/CmdTab-focused-${{ matrix.runner }} --filter StrictMRUAndCompletenessRegressionTests
      - name: Run complete Swift suite
        run: swift test --scratch-path /tmp/CmdTab-test-${{ matrix.runner }}
      - name: Check patch hygiene
        run: git diff --check
