name: Production SEO and GEO Verification

on:
  push:
    branches:
      - agent/verify-production-seo-geo
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-seo-verification.yml

permissions:
  contents: read

concurrency:
  group: production-seo-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify production metadata, schema, links, crawler surfaces, and headers
        env:
          VERIFY_BASE_URL: https://cmdtab.net
          VERIFY_CANONICAL_ORIGIN: https://cmdtab.net
        run: python3 scripts/verify-rendered-site.py

      - name: Verify production desktop, mobile, navigation, tables, and interactive demo
        env:
          VERIFY_BASE_URL: https://cmdtab.net
          VERIFY_ARTIFACT_DIR: production-verification
        run: node scripts/verify-browser.mjs

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmdtab-production-seo-browser-verification
          path: website/production-verification
          if-no-files-found: warn
          retention-days: 7
