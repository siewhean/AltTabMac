name: Finalize Switcher Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/finalize_switcher_docs.py
      - .github/workflows/finalize-switcher-docs.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finalize-switcher-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply asserted documentation updates
        run: python3 scripts/finalize_switcher_docs.py

      - name: Verify canonical documentation
        run: |
          grep -q 'Last Updated: 2026-07-17' README.md
          grep -q 'Complete SwiftPM suite: 123 tests passed' tasks/todo.md
          grep -q 'Preview availability affects presentation only' tasks/todo.md
          grep -q 'PID-level identity' tasks/lessons.md
          git diff --check

      - name: Commit finalized documentation
        run: |
          rm scripts/finalize_switcher_docs.py
          rm .github/workflows/finalize-switcher-docs.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document validated switcher repair"
          git push origin "HEAD:${TARGET_BRANCH}"
