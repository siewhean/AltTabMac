name: Fix Rendered Verifier

on:
  push:
    branches:
      - agent/implement-seo-geo-audit
    paths:
      - .github/workflows/fix-rendered-verifier.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/implement-seo-geo-audit
          fetch-depth: 0

      - name: Make robots verification case-insensitive
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("website/scripts/verify-rendered-site.py")
          text = path.read_text(encoding="utf-8")
          old = '''for expected in (
              "User-agent: OAI-SearchBot",
              "Disallow: /api/",
              f"Sitemap: {CANONICAL_ORIGIN}/sitemap.xml",
          ):
              if expected not in robots_body:
                  fail(f"/robots.txt is missing {expected!r}")'''
          new = '''robots_lower = robots_body.lower()
          for expected in (
              "user-agent: oai-searchbot",
              "disallow: /api/",
              f"sitemap: {CANONICAL_ORIGIN.lower()}/sitemap.xml",
          ):
              if expected not in robots_lower:
                  fail(f"/robots.txt is missing {expected!r}")'''
          if old not in text:
              raise SystemExit("Expected robots verification block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/fix-rendered-verifier.yml

      - name: Commit verifier fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/scripts/verify-rendered-site.py .github/workflows/fix-rendered-verifier.yml
          git commit -m "Make rendered robots verification case-insensitive"
          git push origin HEAD:agent/implement-seo-geo-audit
