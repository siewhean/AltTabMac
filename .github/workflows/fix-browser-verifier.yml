name: Fix Browser Verifier

on:
  push:
    branches:
      - agent/implement-seo-geo-audit
    paths:
      - .github/workflows/fix-browser-verifier.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/implement-seo-geo-audit
          fetch-depth: 0

      - name: Patch local browser verification behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("website/scripts/verify-browser.mjs")
          text = path.read_text(encoding="utf-8")

          old_wait = '''          window.scrollTo(0, 0);
          await new Promise((r) => setTimeout(r, 250));
          resolve(true);'''
          new_wait = '''          await Promise.race([
            Promise.all([...document.images].map((image) => image.complete
              ? Promise.resolve()
              : new Promise((resolveImage) => {
                  image.addEventListener('load', resolveImage, { once: true });
                  image.addEventListener('error', resolveImage, { once: true });
                }))),
            new Promise((resolveTimeout) => setTimeout(resolveTimeout, 8000)),
          ]);
          window.scrollTo(0, 0);
          await new Promise((r) => setTimeout(r, 300));
          resolve(true);'''
          if old_wait not in text:
              raise SystemExit("Expected image-wait block was not found")
          text = text.replace(old_wait, new_wait, 1)

          old_result = '''      const result = evaluated.result?.value || {};
      report.push({ profile: profile.name, path, ...result, consoleErrors, exceptions, failedRequests, badResponses });'''
          new_result = '''      const result = evaluated.result?.value || {};
      if (baseUrl.startsWith("http://127.0.0.1") || baseUrl.startsWith("http://localhost")) {
        for (let index = consoleErrors.length - 1; index >= 0; index -= 1) {
          const message = consoleErrors[index];
          if (message.includes("/_vercel/insights/") || message.includes("/_vercel/speed-insights/")) {
            consoleErrors.splice(index, 1);
          }
        }
      }
      report.push({ profile: profile.name, path, ...result, consoleErrors, exceptions, failedRequests, badResponses });'''
          if old_result not in text:
              raise SystemExit("Expected browser-result block was not found")
          text = text.replace(old_result, new_result, 1)

          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/fix-browser-verifier.yml

      - name: Commit browser verifier fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/scripts/verify-browser.mjs .github/workflows/fix-browser-verifier.yml
          git commit -m "Handle local analytics and lazy images in browser verification"
          git push origin HEAD:agent/implement-seo-geo-audit

# Triggered after rendered-browser diagnostics were reviewed.
