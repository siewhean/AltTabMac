name: CmdTab Backup Restore Release Evidence

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Canonical immutable release tag
        required: true
        type: string
      backup_run_id:
        description: Successful CmdTab Database Backup workflow run ID
        required: true
        type: string
      restore_run_id:
        description: Successful CmdTab Database Restore Drill workflow run ID
        required: true
        type: string
      migration_run_id:
        description: Successful CmdTab Production Database Migration workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cmdtab-backup-restore-release-evidence
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-database
    steps:
      - name: Checkout canonical release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Download real backup workflow receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: database-backup-receipt-${{ inputs.backup_run_id }}
          path: dist/backup-input
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download real restore workflow receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: database-restore-receipt-${{ inputs.restore_run_id }}
          path: dist/restore-input
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download provider-verified Neon recovery receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cmdtab-production-migration-${{ inputs.migration_run_id }}
          path: dist/migration-input
          run-id: ${{ inputs.migration_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate bound backup and restore release receipt
        run: |
          set -euo pipefail
          node scripts/generate_backup_restore_release_receipt.mjs \
            dist/backup-input/database-backup-receipt.json \
            dist/restore-input/database-restore-receipt.json \
            dist/migration-input/neon-recovery-receipt.json \
            dist/backup-restore-receipt.json

      - name: Upload generated release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmdtab-backup-restore-release-evidence-${{ github.run_id }}
          path: |
            dist/backup-restore-receipt.json
            dist/migration-input/neon-recovery-receipt.json
          if-no-files-found: error
          retention-days: 365
