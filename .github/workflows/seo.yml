name: SEO and GEO

on:
  push:
    paths:
      - website/**
      - .github/workflows/seo.yml
  pull_request:
    branches:
      - main
    paths:
      - website/**
      - .github/workflows/seo.yml

permissions:
  contents: read

concurrency:
  group: seo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_SITE_VERIFICATION: cmdtab-google-verification-ci
      BING_SITE_VERIFICATION: cmdtab-bing-verification-ci
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify SEO implementation and committed showcase media
        run: npm run seo:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build production website
        run: npx next build --webpack

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/cmdtab-next.log 2>&1 &
          echo $! > /tmp/cmdtab-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cmdtab-next.log
          exit 1

      - name: Verify rendered metadata, schema, links, and headers
        run: |
          mkdir -p verification-artifacts
          set -o pipefail
          npm run rendered:check 2>&1 | tee verification-artifacts/rendered-check.log

      - name: Verify rendered webmaster ownership metadata
        run: |
          mkdir -p verification-artifacts
          set -o pipefail
          npm run webmaster:check 2>&1 | tee verification-artifacts/webmaster-check.log

      - name: Verify byte-matched public evidence downloads
        run: |
          mkdir -p verification-artifacts
          set -o pipefail
          npm run evidence:check 2>&1 | tee verification-artifacts/evidence-check.log

      - name: Verify rendered entity and retrieval surfaces
        run: |
          mkdir -p verification-artifacts
          set -o pipefail
          npm run retrieval:check 2>&1 | tee verification-artifacts/retrieval-check.log

      - name: Verify rendered showcase page and media responses
        run: |
          mkdir -p verification-artifacts
          set -o pipefail
          npm run showcase:responses 2>&1 | tee verification-artifacts/showcase-responses.log

      - name: Verify desktop, mobile, media, and interactive browser behavior
        run: |
          mkdir -p verification-artifacts
          set -o pipefail
          npm run browser:check 2>&1 | tee verification-artifacts/browser-check.log

      - name: Capture showcase and feature visual evidence
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          for route in showcase features/classic-grid features/command-palette features/radial-menu features/quick-actions; do
            slug="${route//\//-}"
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=5000 --window-size=1440,1000 --screenshot="verification-artifacts/desktop-${slug}.png" "http://127.0.0.1:3000/${route}"
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=5000 --window-size=390,844 --screenshot="verification-artifacts/mobile-${slug}.png" "http://127.0.0.1:3000/${route}"
          done
          cp public/showcase/manifest.json verification-artifacts/showcase-manifest.json
          cp public/showcase/*-poster.webp verification-artifacts/

      - name: Collect verification evidence
        if: always()
        run: |
          mkdir -p verification-artifacts
          cp /tmp/cmdtab-next.log verification-artifacts/next-server.log 2>/dev/null || true
          if [ -f /tmp/cmdtab-next.pid ]; then
            kill "$(cat /tmp/cmdtab-next.pid)" 2>/dev/null || true
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmdtab-seo-browser-verification
          path: website/verification-artifacts
          if-no-files-found: warn
          retention-days: 14
